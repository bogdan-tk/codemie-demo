version: '3.8'

# Docker Compose configuration for OrderService testing
# Jira: EPMCDMETST-36038
# Purpose: Provides PostgreSQL database for local integration testing

services:
  orderservice-postgres:
    image: postgres:15-alpine
    container_name: orderservice-postgres-test
    environment:
      POSTGRES_DB: orderservice_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - orderservice-test-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - orderservice-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d orderservice_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  orderservice-test-data:
    driver: local

networks:
  orderservice-test-network:
    driver: bridge
