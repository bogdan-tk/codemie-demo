# Test Configuration for AuthService
# Test Case ID: EPMCDMETST-36039

# Server Configuration
server.port=0

# JWT Configuration
jwt.secret=testSecretKeyForJWTTokenGenerationAndValidationInTestEnvironment1234567890
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# Redis Configuration (Testcontainers)
spring.redis.host=localhost
spring.redis.port=6379

# Logging Configuration
logging.level.com.microservices.auth=DEBUG
logging.level.org.springframework.security=DEBUG

# Spring Security
spring.security.user.name=testuser
spring.security.user.password=testpassword

# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable CSRF for testing
spring.security.csrf.enabled=false

# Test-specific properties
auth.service.test.mode=true
auth.service.rate-limit.enabled=true
auth.service.rate-limit.max-attempts=5
auth.service.rate-limit.duration=300000

# OpenAPI Documentation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
